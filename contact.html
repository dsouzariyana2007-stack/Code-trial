<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Contact the Hello World project."><title>Contact · Hello, World!</title><link rel="stylesheet" href="site.css"></head>
<body><div class="aurora" aria-hidden="true"></div><main><nav aria-label="Primary navigation"><a href="index.html">Home</a><a href="about.html">About</a><a class="active" href="contact.html">Contact</a></nav><p class="eyebrow">Drop a line</p><h1>Say hello.</h1><p>Have an idea, a question, or simply want to share a kind word? I’d love to hear it.</p><form id="contact-form"><label>Your email<input type="email" placeholder="you@example.com" required></label><label>Your message<textarea rows="3" placeholder="Hello there…" required></textarea></label><button type="submit">Send message</button></form><p class="form-message" id="form-message" aria-live="polite"></p></main><script>document.querySelector('#contact-form').addEventListener('submit',event=>{event.preventDefault();event.currentTarget.reset();document.querySelector('#form-message').textContent='Thanks — your hello has been received! ✨'});</script></body></html>
