<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A polished Hello World landing page." />
    <title>Hello, World!</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f7f4ff;
        --muted: #c5bed7;
        --violet: #9b7cff;
        --cyan: #67e8f9;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: #100d1c;
      }

      .aurora {
        position: fixed;
        inset: -25%;
        z-index: -1;
        background:
          radial-gradient(circle at 25% 35%, rgba(103, 232, 249, .32), transparent 22rem),
          radial-gradient(circle at 75% 30%, rgba(155, 124, 255, .38), transparent 25rem),
          radial-gradient(circle at 50% 80%, rgba(244, 114, 182, .2), transparent 25rem);
        filter: blur(24px);
        animation: drift 13s ease-in-out infinite alternate;
      }

      main {
        width: min(92vw, 740px);
        padding: clamp(2.2rem, 7vw, 5rem);
        text-align: center;
        border: 1px solid rgba(255,255,255,.18);
        border-radius: 30px;
        background: linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,.045));
        box-shadow: 0 28px 80px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.18);
        backdrop-filter: blur(18px);
        animation: rise .8s cubic-bezier(.2,.8,.2,1) both;
      }

      .eyebrow {
        margin: 0 0 1.2rem;
        color: var(--cyan);
        font-size: .78rem;
        font-weight: 800;
        letter-spacing: .2em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 10vw, 6.9rem);
        letter-spacing: -.075em;
        line-height: .95;
        background: linear-gradient(110deg, #fff 14%, #c4b5fd 48%, #67e8f9 88%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p {
        max-width: 35rem;
        margin: 1.55rem auto 2.1rem;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.18rem);
        line-height: 1.65;
      }

      button {
        padding: .9rem 1.3rem;
        border: 0;
        border-radius: 999px;
        color: #1d1238;
        background: linear-gradient(110deg, var(--cyan), #ddd6fe);
        box-shadow: 0 10px 25px rgba(103,232,249,.22);
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        transition: transform .2s ease, box-shadow .2s ease;
      }

      button:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 16px 32px rgba(103,232,249,.35); }
      button:focus-visible { outline: 3px solid white; outline-offset: 4px; }

      nav { display: flex; justify-content: center; gap: .45rem; margin: -1.2rem 0 2.8rem; }
      nav a { padding: .45rem .8rem; border-radius: 999px; color: var(--muted); font-size: .9rem; text-decoration: none; transition: background .2s ease, color .2s ease; }
      nav a:hover, nav a.active { color: var(--ink); background: rgba(255,255,255,.12); }

      .sparkle {
        display: inline-block;
        margin-left: .2em;
        color: #fde68a;
        animation: twinkle 1.8s ease-in-out infinite;
      }

      @keyframes rise { from { opacity: 0; transform: translateY(28px) scale(.97); } to { opacity: 1; transform: none; } }
      @keyframes drift { to { transform: rotate(10deg) scale(1.08) translate(3%, -2%); } }
      @keyframes twinkle { 50% { transform: rotate(18deg) scale(1.25); } }

      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <div class="aurora" aria-hidden="true"></div>
    <main>
      <nav aria-label="Primary navigation">
        <a class="active" href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <p class="eyebrow">A small beginning</p>
      <h1>Hello, World<span class="sparkle">✦</span></h1>
      <p>Every great idea starts with a single line. This is yours—bright, welcoming, and ready for what comes next.</p>
      <button type="button" id="hello-button">Say hello back</button>
    </main>
    <script>
      const button = document.querySelector('#hello-button');
      button.addEventListener('click', () => {
        button.textContent = 'Hello to you too! ✨';
      });
    </script>
  </body>
</html>
